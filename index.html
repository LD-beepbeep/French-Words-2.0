<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>French-Dutch Vocabulary Trainer</title>
    <link href="https://fonts.googleapis.com/css?family=Inter:400,600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(120deg, #4f8cff 0%, #38cfa7 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 6px 32px rgba(60,80,120,0.15), 0 1.5px 5px rgba(60,80,120,0.08);
            padding: 2.5rem 2rem 2rem 2rem;
            max-width: 410px;
            width: 100%;
        }
        h1, h2, h3 {
            font-weight: 600;
            color: #26415b;
            margin-top: 0;
        }
        h1 { font-size: 2rem; margin-bottom: 1.6rem;}
        h2 { font-size: 1.18rem; margin-bottom: 0.8rem;}
        h3 { font-size: 1.1rem; margin-bottom: 0.65rem;}
        label { font-weight: 500; color: #4f8cff; }
        .btn {
            display: inline-block;
            background: #4f8cff;
            color: white;
            font-family: inherit;
            border: none;
            border-radius: 0.8rem;
            padding: 0.7em 1.4em;
            margin: 0.25em 0.25em 0.25em 0;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(60,80,120,0.08);
            transition: background 0.15s;
        }
        .btn:active, .btn:focus { background: #3274e0; outline: none;}
        .btn-accent { background: #38cfa7; }
        .btn-accent:active, .btn-accent:focus { background: #22b98d;}
        .btn-secondary {
            background: #f0f3fa; color: #26415b;
            border: 1px solid #dbe8f4;
        }
        .btn-secondary:active, .btn-secondary:focus {
            background: #e0e7f4;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        .inputs-row {
            display: flex;
            gap: 0.5em;
            margin-bottom: 1em;
        }
        input[type="text"] {
            padding: 0.7em 1em;
            border: 1px solid #d0d5dd;
            border-radius: 0.7rem;
            font-size: 1rem;
            width: 100%;
            margin-bottom: 0.6em;
            box-sizing: border-box;
            transition: border 0.15s;
        }
        input[type="text"]:focus {
            border-color: #4f8cff;
            outline: none;
        }
        #recent-list, #hard-words-list {
            margin-bottom: 1.1em;
        }
        .recent-item, .hard-word-item {
            background: #f8fafd;
            border-radius: 0.6rem;
            padding: 0.5em 0.8em;
            margin-bottom: 0.35em;
            font-size: 0.99em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hard-word-content { flex: 1; }
        .remove-hard-btn {
            background: #fff0f0;
            color: #b34646;
            border: 1px solid #f6c8c8;
            border-radius: 0.7rem;
            padding: 0.3em 0.9em;
            font-size: 0.97em;
            cursor: pointer;
            margin-left: 0.7em;
            transition: background 0.09s;
        }
        .remove-hard-btn:active, .remove-hard-btn:focus {
            background: #ffdede;
        }
        #feedback {
            min-height: 1.6em;
            text-align: center;
            font-size: 1.08em;
        }
        .feedback.correct { color: #38cfa7; }
        .feedback.incorrect { color: #b34646; }
        /* Modal */
        .modal {
            display: none;
            position: fixed; z-index: 1000;
            left: 0; top: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.3); justify-content: center; align-items: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #fff; padding: 2em 1.3em; border-radius: 1.2rem; box-shadow: 0 2px 14px #2222;
            max-width: 90vw; text-align: center;
        }
        /* Responsive */
        @media (max-width: 600px) {
            .container { max-width: 99vw; border-radius: 0; padding: 1.1em 0.2em;}
            h1 { font-size: 1.3rem;}
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="main-menu" class="screen active">
            <h1>French-Dutch Vocabulary Trainer</h1>
            <button class="btn" onclick="startQuiz()">Start Quiz</button>
            <button class="btn" onclick="practiceHardWords()">Practice Hard Words</button>
            <button id="practice-custom-btn" class="btn btn-accent" onclick="practiceCustomWords()">Practice Custom Words</button>
            <div style="margin: 1.2em 0;">
                <p>Words in vocabulary: <span id="vocab-count"></span></p>
                <p>Hard words: <span id="hard-count"></span></p>
            </div>
            <h2>Add Custom Word</h2>
            <div class="inputs-row">
                <input type="text" id="french-word" placeholder="French word">
                <input type="text" id="dutch-word" placeholder="Dutch translation">
                <button class="btn" onclick="addNewWord()">Add</button>
            </div>
            <div>
                <h3>Recently Added Words</h3>
                <div id="recent-list"></div>
            </div>
            <div>
                <h3>Hard Words List</h3>
                <div id="hard-words-list"></div>
                <button id="practice-hard-btn" class="btn btn-accent" onclick="practiceHardWords()" style="display:none;">Quiz Hard Words</button>
                <button id="clear-hard-btn" class="btn btn-secondary" onclick="clearHardWords()" style="display:none;">Clear Hard Words</button>
            </div>
        </div>

        <div id="quiz-screen" class="screen">
            <button class="btn btn-secondary" onclick="showMainMenu()" style="float:right; margin-top:-0.7em;">Back</button>
            <h2 style="margin-bottom:0.6em;">Quiz</h2>
            <div style="margin-bottom:1.5em;">
                <span id="question-direction" style="font-weight:600; color:#4f8cff;"></span>
                <span id="question-text" style="font-weight:500;"></span>
            </div>
            <div class="inputs-row" style="margin-bottom:0;">
                <input type="text" id="answer-input" autocomplete="off" placeholder="Your answer">
                <button class="btn" onclick="submitAnswer()">Submit</button>
            </div>
            <div id="feedback" class="feedback"></div>
            <div style="margin-top:1.5em;">
                <p>Score: <span id="current-score"></span> (<span id="score-percentage"></span>)</p>
                <p>Question #: <span id="question-number"></span></p>
            </div>
        </div>

        <div id="hard-words-modal" class="modal">
            <div class="modal-content">
                <h3>Add to Hard Words?</h3>
                <p>This word will be added to your hard words list for extra practice. Continue?</p>
                <button onclick="addToHardWords(true)" class="btn btn-accent">Add</button>
                <button onclick="addToHardWords(false)" class="btn btn-secondary">Skip</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
