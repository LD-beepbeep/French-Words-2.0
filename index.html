<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>French-Dutch Vocabulary Trainer</title>
    <style>
        .screen { display: none; }
        .screen.active { display: block; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #fff; padding: 2em; border-radius: 8px; box-shadow: 0 2px 8px #2222; max-width: 90vw; text-align: center; }
        .btn { margin: 0.5em; }
        .feedback { font-weight: bold; margin: 1em 0; }
        .feedback.correct { color: green; }
        .feedback.incorrect { color: red; }
    </style>
</head>
<body>
    <div id="main-menu" class="screen active">
        <h1>French-Dutch Vocabulary Trainer</h1>
        <button class="btn" onclick="startQuiz()">Start Quiz</button>
        <button class="btn" onclick="practiceHardWords()">Practice Hard Words</button>
        <button id="practice-custom-btn" class="btn btn-accent" onclick="practiceCustomWords()">Practice Custom Words</button>
        <div>
            <p>Words in vocabulary: <span id="vocab-count"></span></p>
            <p>Hard words: <span id="hard-count"></span></p>
        </div>
        <h2>Add Custom Word</h2>
        <input type="text" id="french-word" placeholder="French word">
        <input type="text" id="dutch-word" placeholder="Dutch translation">
        <button class="btn" onclick="addNewWord()">Add Word</button>
        <div id="recent-list"></div>
        <h2>Hard Words List</h2>
        <div id="hard-words-list"></div>
        <button id="practice-hard-btn" class="btn" onclick="practiceHardWords()" style="display:none;">Quiz Hard Words</button>
        <button id="clear-hard-btn" class="btn" onclick="clearHardWords()" style="display:none;">Clear Hard Words</button>
    </div>

    <div id="quiz-screen" class="screen">
        <button class="btn" onclick="showMainMenu()">Back to Menu</button>
        <h2>Quiz</h2>
        <div>
            <span id="question-direction"></span>
            <span id="question-text"></span>
        </div>
        <input type="text" id="answer-input" autocomplete="off" placeholder="Your answer">
        <button class="btn" onclick="submitAnswer()">Submit</button>
        <div id="feedback" class="feedback"></div>
        <div>
            <p>Score: <span id="current-score"></span> (<span id="score-percentage"></span>)</p>
            <p>Question #: <span id="question-number"></span></p>
        </div>
    </div>

    <div id="hard-words-modal" class="modal">
        <div class="modal-content">
            <h3>Add to Hard Words?</h3>
            <p>This word will be added to your hard words list for extra practice. Continue?</p>
            <button onclick="addToHardWords(true)" class="btn btn-primary">Add</button>
            <button onclick="addToHardWords(false)" class="btn btn-secondary">Skip</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
